title: "Exam craft"
hero_title: "Exam craft"
kicker: "J277 · two papers · command words · past papers"
description: >-
  Paper shapes, command words, and how to use past papers. Optional timing —
  this site never locks a mock or a score.
template: academy_cs_unit.html
doc_id: "exams"
unit_id: exams
strip_leading_h1: true
exercises:
  - id: e1
    topic: command
    kind: paper
    title: Same fact, three command words
    task: |
      Topic: cache memory.

      1. State what cache is. (1)
      2. Describe how cache is used in a CPU. (2)
      3. Explain how increasing cache size can improve performance. (2)
    hint: State = name/definition. Describe = what it does. Explain = because / so.
    answer: |
      1. Fast memory on or next to the CPU holding copies of recently used instructions/data.

      2. When the CPU needs an instruction or data, it checks cache first; if it is there it is used instead of fetching from slower RAM.

      3. A larger cache holds more of the working set, so there are fewer slow RAM accesses, so more time is spent executing rather than waiting.
  - id: e2
    topic: command
    kind: paper
    title: Compare in one sentence pair
    task: |
      Compare a compiler and an interpreter. (4)
      Write two clear differences, each mentioning both translators.
    hint: “A compiler … whereas an interpreter …”
    answer: |
      A compiler translates the whole source into machine code before it runs, whereas an interpreter translates and runs statement by statement.

      Compiled programs usually run faster and do not need the compiler at run time, whereas interpreted programs need the interpreter every time and are usually slower.
  - id: e3
    topic: papers
    kind: paper
    title: Which paper?
    task: |
      1. Draw a truth table for A AND NOT B.
      2. Explain one ethical issue of CCTV.
      3. Complete a trace table.
      4. Convert 11010110 to hex.
      5. Write a validation loop for a password length.
    hint: 01 = systems. 02 = thinking/programming. Some topics only live on one paper.
    answer: |
      1. Paper 2 (2.4)
      2. Paper 1 (1.6)
      3. Paper 2 (2.1 / Section B)
      4. Paper 1 (1.2.4)
      5. Paper 2 (2.3 / Section B)
  - id: e4
    topic: past
    kind: think
    title: Optional timed slice (you hold the clock)
    task: |
      If you want pressure: set 12 minutes. Answer one 8-mark 1.6-style
      discuss from your own head (facial recognition in shops, or energy
      use of AI). Then stop, even if unfinished, and mark against the
      1.6 model structure: stakeholders, both sides, law, limitation,
      conclusion.

      If you do not want a timer, skip this. The rest of the course stays open.
    hint: Discuss = both sides + conclusion. Laws if they fit.
    answer: |
      Structure check, not a “right essay”:

      - Named stakeholders
      - At least one benefit
      - At least one harm
      - A law or licence if relevant (DPA for faces)
      - A limitation
      - A one-line conclusion that answers the question
quiz:
  - id: q1
    topic: papers
    type: single
    prompt: Each J277 paper is…
    options:
      - 45 minutes, 40 marks, calculator allowed
      - 1 hour 30 minutes, 80 marks, no calculator
      - Coursework plus a 20-minute quiz
      - Oral only
    correct: 1 hour 30 minutes, 80 marks, no calculator
    explain: Two papers, equal weight, non-calculator, no NEA.
  - id: q2
    topic: command
    type: single
    prompt: “Explain” almost always needs…
    options:
      - A drawing of a mesh and nothing else
      - A because / so link
      - A single tick
      - Hex only
    correct: A because / so link
    explain: Describe = what. Explain = why it happens / why it helps.
  - id: q3
    topic: command
    type: single
    prompt: A “discuss” answer that only lists benefits will typically…
    options:
      - Reach full marks
      - Be capped because the other side and a conclusion are missing
      - Convert the paper into coursework
      - Unlock the next unit on this site
    correct: Be capped because the other side and a conclusion are missing
    explain: Discuss wants balance. This site does not unlock units with scores — that last option is a joke at the gate we refused to build.
  - id: q4
    topic: papers
    type: multi
    prompt: Which belong mainly on Paper 2? (Select all that apply)
    options:
      - Trace tables
      - Fetch–execute cycle
      - Writing an algorithm in ERL
      - Data Protection Act
    correct:
      - Trace tables
      - Writing an algorithm in ERL
    explain: Fetch–execute and DPA are Paper 1. Algorithms and ERL are Paper 2.
  - id: q5
    topic: past
    type: truefalse
    prompt: You must finish every past paper on this site before opening unit 2.1.
    options:
      - True
      - False
    correct: "False"
    explain: Nothing is gated. Past papers are a tool you pick up when you want them.
  - id: q6
    topic: papers
    type: single
    prompt: Paper 2 Section B is typically…
    options:
      - A long programming scenario
      - A practical exam on a school network
      - An oral with the examiner
      - Optional extra credit
    correct: A long programming scenario
    explain: Design, write, correct, complete algorithms. Compulsory part of J277/02.
