title: "1.4 Network security"
hero_title: "Network security"
kicker: "Paper 1 · J277/01 · unit 1.4"
description: >-
  Malware, phishing, brute force, DoS, interception, SQL injection, and the
  defences that actually match them. Open exercises and quiz.
template: academy_cs_unit.html
doc_id: "1-4"
unit_id: "1.4"
strip_leading_h1: true
exercises:
  - id: e1
    topic: "1.4.1"
    kind: paper
    title: Name the attack
    task: |
      1. Thousands of PCs flood an online shop until it will not load.
      2. An email looks like the school, asking you to “confirm” your password on a fake page.
      3. A program encrypts the office files and asks for Bitcoin.
      4. A form on a website dumps the users table when you type ' OR 1=1 --
      5. Software hides in a free calculator and emails your files out.
    hint: DDoS, phishing, ransomware, SQL injection, trojan.
    answer: |
      1. (D)DoS
      2. Phishing (social engineering)
      3. Ransomware (malware)
      4. SQL injection
      5. Trojan (malware)
  - id: e2
    topic: "1.4.1"
    kind: paper
    title: Virus vs worm
    task: |
      Write two differences that would satisfy a 2-mark compare.
    hint: How they spread, and whether they need a host file / user action.
    answer: |
      A virus attaches to a host file and typically needs the user to run it; a worm is standalone and can copy itself across a network without that.

      A virus infects files; a worm consumes bandwidth/resources by replicating between machines.
  - id: e3
    topic: "1.4.2"
    kind: paper
    title: Match the defence
    task: |
      For each threat, name one technical defence and one sentence on how it helps.

      1. Brute force on the staff portal
      2. Packet sniffing on café Wi-Fi
      3. SQL injection
      4. Stolen laptop
    hint: Lockouts/2FA; HTTPS/VPN; sanitise/parameterise; disk encryption + physical lock.
    answer: |
      1. Account lockout after N failures and/or 2FA — guessing becomes useless or too slow
      2. HTTPS (or a VPN) — intercepted packets are ciphertext
      3. Parameterised queries / input validation — user text cannot become SQL commands
      4. Full-disk encryption + physical locks — stolen hardware does not yield readable files
  - id: e4
    topic: "1.4.2"
    kind: think
    title: Why pentest is not enough
    task: |
      A company does a penetration test in March and finds nothing. Give two
      reasons they could still be breached in September.
    hint: New software, new staff, phishing, unpatched systems, one test is a snapshot.
    answer: |
      New vulnerabilities appear (unpatched software, new services).

      Staff can still be phished; a pentest does not fix human error or guarantee future safety.

      Attack surface changes — a plugin added in June was never tested.
quiz:
  - id: q1
    topic: "1.4.1"
    type: single
    prompt: Ransomware typically…
    options:
      - Speeds up your SSD
      - Encrypts files and demands payment for the key
      - Is a type of switch
      - Translates domain names
    correct: Encrypts files and demands payment for the key
    explain: Ransomware is malware whose payload is extortion via encryption.
  - id: q2
    topic: "1.4.1"
    type: single
    prompt: SQL injection attacks a system by…
    options:
      - Overheating the CPU
      - Inserting malicious SQL into an input so the database runs it
      - Flooding a web server with traffic
      - Guessing Wi-Fi passwords only
    correct: Inserting malicious SQL into an input so the database runs it
    explain: The application treats user input as code. Parameterised queries stop it.
  - id: q3
    topic: "1.4.1"
    type: single
    prompt: Phishing is best classified as…
    options:
      - A hardware failure
      - Social engineering
      - A compression algorithm
      - A topology
    correct: Social engineering
    explain: It tricks a person into giving up secrets. The firewall never “fails” in the technical sense — the human did.
  - id: q4
    topic: "1.4.2"
    type: single
    prompt: A firewall is used to…
    options:
      - Compress images
      - Allow or block network traffic according to rules
      - Translate domain names
      - Store the BIOS
    correct: Allow or block network traffic according to rules
    explain: Firewalls filter traffic. They do not replace anti-malware or encryption.
  - id: q5
    topic: "1.4.2"
    type: multi
    prompt: Which defences help against data interception? (Select all that apply)
    options:
      - Encryption (HTTPS, WPA3, VPN)
      - Using HTTP only
      - Physical control of wiring closets
      - Posting passwords on the intranet home page
    correct:
      - Encryption (HTTPS, WPA3, VPN)
      - Physical control of wiring closets
    explain: Encryption makes sniffed bits useless. Physical security reduces the chance of a tap. HTTP is plaintext — the wrong way.
  - id: q6
    topic: "1.4.2"
    type: single
    prompt: Penetration testing is…
    options:
      - An illegal attack
      - An authorised attempt to find weaknesses so they can be fixed
      - A type of RAID
      - The same as a DDoS
    correct: An authorised attempt to find weaknesses so they can be fixed
    explain: Permission is the difference between a pentest and a crime. It identifies issues; someone still has to patch them.
  - id: q7
    topic: "1.4.1"
    type: single
    prompt: A worm differs from a virus because a worm…
    options:
      - Can only infect images
      - Typically self-replicates across a network without a host file
      - Is always beneficial
      - Only works on optical disks
    correct: Typically self-replicates across a network without a host file
    explain: Viruses piggy-back on files the user runs. Worms spread themselves.
