    topic: "2.1.3"
    type: single
    prompt: After the first full pass of an ascending bubble sort, which is true?
    options:
      - The whole list is always fully sorted
      - The largest item is in its final position
      - No further passes are ever needed
      - The list is converted to hex
    correct: The largest item is in its final position
    explain: Each pass bubbles the next extreme to the end. More passes are still needed for the rest.
