      - Divide and conquer — split, then merge sorted halves
      - Inserting each item into a sorted left-hand side only
      - A search that needs unsorted data
    correct: Divide and conquer — split, then merge sorted halves
    explain: Bubble is neighbour swaps. Insertion builds a sorted left portion. Merge splits then merges.
