title: "1.2 Memory and storage"
hero_title: "Memory and storage"
kicker: "Paper 1 · J277/01 · unit 1.2"
description: >-
  RAM, ROM, virtual memory, HDD/SSD/optical, units, binary/hex, images, sound,
  and compression. Practice conversions and a self-check quiz — all open.
template: academy_cs_unit.html
doc_id: "1-2"
unit_id: "1.2"
strip_leading_h1: true
exercises:
  - id: e1
    topic: "1.2.1"
    kind: paper
    title: RAM, ROM, or virtual memory?
    task: |
      Which kind of primary storage, and why?

      1. Holds the first instructions used when the computer is switched on.
      2. Holds the document you are typing right now.
      3. Uses part of the hard disk when RAM is full.
      4. Loses its contents when you pull the plug.
    hint: Volatile = RAM. Boot firmware = ROM. Disk pretending to be extra RAM = virtual memory.
    answer: |
      1. ROM — non-volatile bootstrap/firmware
      2. RAM — working data for running programs
      3. Virtual memory — overflow onto secondary storage
      4. RAM — volatile
  - id: e2
    topic: "1.2.2"
    kind: paper
    title: Pick a drive
    task: |
      Recommend magnetic, solid state, or optical, with two characteristics:

      1. OS drive in a thin laptop that gets thrown in a bag
      2. Backing up 8 TB of CCTV overnight, cheapest per GB
      3. Handing a film to a festival that still wants a disc
    hint: Durability and speed vs cost vs removable standard.
    answer: |
      1. SSD — portable, no moving parts (durable in a bag), fast boot
      2. Magnetic HDD (or tape) — high capacity, low cost per GB, speed less critical
      3. Optical (Blu-ray/DVD) — cheap removable, widely accepted, even if slower
  - id: e3
    topic: "1.2.3"
    kind: paper
    title: Convert without a calculator
    task: |
      Show working.

      1. How many bits in 4 KB? (use 1 KB = 1024 bytes)
      2. A file is 3,145,728 bytes. How many MB is that?
      3. How many nibbles in one byte?
    hint: 4 KB = 4 × 1024 bytes, each byte 8 bits. 1024 × 1024 = 1,048,576 bytes in a MB.
    answer: |
      1. 4 × 1024 = 4096 bytes; × 8 = 32,768 bits
      2. 3,145,728 ÷ 1,024 = 3,072 KB; ÷ 1,024 = 3 MB
      3. 2 nibbles (4 bits + 4 bits)
  - id: e4
    topic: "1.2.4"
    kind: paper
    title: Binary, denary, hex
    task: |
      1. Convert 10110100 to denary.
      2. Convert 45 denary to 8-bit binary.
      3. Convert 10110100 to hex.
      4. Add 00001111 + 00000001 in 8-bit binary.
      5. Left-shift 00001101 by one place. What denary was it, and what is it now?
    hint: Place values 128 64 32 16 8 4 2 1. Hex groups of 4 bits. Left shift ×2.
    answer: |
      1. 128+32+16+4 = 180
      2. 32+8+4+1 = 45 → 00101101
      3. 1011 0100 → B 4 → B4
      4. 00010000
      5. 00001101 = 13; left shift → 00011010 = 26
  - id: e5
    topic: "1.2.4"
    kind: paper
    title: Image and sound sizes
    task: |
      Uncompressed. Show working. Give answers in MB to 2 decimal places if needed
      (or leave as exact fractions of 1024).

      1. Bitmap 800 × 600, colour depth 24 bits. Size in MB.
      2. Mono sound, 44,100 Hz, 16-bit samples, 10 seconds. Size in MB.
    hint: Image bits = w × h × depth. Sound bits = rate × depth × time × channels.
    answer: |
      1. 800 × 600 × 24 = 11,520,000 bits
         ÷ 8 = 1,440,000 bytes
         ÷ 1024 = 1,406.25 KB
         ÷ 1024 ≈ 1.37 MB

      2. 44100 × 16 × 10 × 1 = 7,056,000 bits
         ÷ 8 = 882,000 bytes
         ÷ 1024 ≈ 861.33 KB
         ÷ 1024 ≈ 0.84 MB
  - id: e6
    topic: "1.2.5"
    kind: think
    title: Lossy or lossless?
    task: |
      Pick one and say why.

      1. Streaming a pop song on a phone data plan
      2. A contract PDF a solicitor must not alter
      3. A screenshot of a Python error you need to read later
      4. Holiday photos for social media
    hint: If you cannot afford to lose exact bits, lossless. If ears/eyes will not notice, lossy is allowed.
    answer: |
      1. Lossy (MP3/AAC) — smaller, good-enough audio
      2. Lossless — exact original required
      3. Lossless (PNG) — sharp text; JPEG would blur the code
      4. Lossy (JPEG) — small files, acceptable quality
quiz:
  - id: q1
    topic: "1.2.1"
    type: single
    prompt: Why is RAM described as volatile?
    options:
      - It can only be written once at the factory
      - Its contents are lost when power is removed
      - It is slower than a hard disk
      - It stores the BIOS
    correct: Its contents are lost when power is removed
    explain: Volatile = needs power to keep data. That is RAM. ROM and secondary storage keep data with the power off.
  - id: q2
    topic: "1.2.1"
    type: single
    prompt: Virtual memory is used when…
    options:
      - The CPU has no cache
      - RAM is full and the OS moves inactive pages to secondary storage
      - ROM needs to be updated
      - You compress a JPEG
    correct: RAM is full and the OS moves inactive pages to secondary storage
    explain: Virtual memory extends RAM onto disk. It is slower; too much of it is thrashing.
  - id: q3
    topic: "1.2.2"
    type: single
    prompt: Which secondary storage typically has no moving parts and is most shock-resistant?
    options:
      - Magnetic HDD
      - Optical DVD
      - Solid state (SSD)
      - Magnetic tape
    correct: Solid state (SSD)
    explain: Flash chips, no platters or laser sleds. That is why laptops and bagged cameras like SSDs.
  - id: q4
    topic: "1.2.3"
    type: short
    prompt: How many bits are in a byte? (number only)
    options: []
    correct: "8"
    explain: A byte is 8 bits. A nibble is 4 bits.
  - id: q5
    topic: "1.2.4"
    type: single
    prompt: What denary value is the binary number 00010110?
    options:
      - "16"
      - "22"
      - "32"
      - "86"
    correct: "22"
    explain: 16+4+2 = 22.
  - id: q6
    topic: "1.2.4"
    type: single
    prompt: A left shift of one place on a binary integer (with no overflow) is equivalent to…
    options:
      - Dividing by 2
      - Multiplying by 2
      - Adding 1
      - Converting to hex
    correct: Multiplying by 2
    explain: Each left shift multiplies by 2. Right shift divides by 2 (integer, bits fall off).
  - id: q7
    topic: "1.2.4"
    type: single
    prompt: Uncompressed bitmap file size in bits is…
    options:
      - Width + height + colour depth
      - Width × height × colour depth
      - Width × height ÷ colour depth
      - Colour depth only
    correct: Width × height × colour depth
    explain: Every pixel uses colour-depth bits. Multiply by how many pixels (width × height). Then convert units if asked.
  - id: q8
    topic: "1.2.5"
    type: single
    prompt: Which statement about lossy compression is true?
    options:
      - The original file can always be reconstructed exactly
      - Some data is discarded and cannot be recovered
      - It is only used for Word documents
      - It always makes files larger
    correct: Some data is discarded and cannot be recovered
    explain: Lossy throws data away (JPEG, MP3). Lossless (PNG, ZIP) can rebuild the original bits.
  - id: q9
    topic: "1.2.4"
    type: multi
    prompt: Which of these are reasons hexadecimal is used? (Select all that apply)
    options:
      - Easier for humans to read than long binary
      - Converts neatly because one hex digit is 4 bits
      - Computers only store hex, never binary
      - Used in colour codes and memory addresses
    correct:
      - Easier for humans to read than long binary
      - Converts neatly because one hex digit is 4 bits
      - Used in colour codes and memory addresses
    explain: Machines still work in binary. Hex is a human-friendly grouping of those bits.
