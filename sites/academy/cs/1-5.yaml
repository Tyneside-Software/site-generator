exercises:
  - id: e1
    topic: "1.5.1"
    kind: paper
    title: Name the OS job
    task: |
      Which OS function?

      1. Two applications appear to run at once on one core.
      2. A new graphics card needs extra software before games will see it.
      3. Lewis and Dad have separate accounts and cannot see each other’s files.
      4. RAM is shared between Chrome and Python without them overwriting each other.
      5. You rename a folder of revision notes.
    hint: Multitasking, drivers/peripherals, user management, memory, file management.
    answer: |
      1. Multitasking / scheduling
      2. Peripheral management (device driver)
      3. User management
      4. Memory management
      5. File management
  - id: e2
    topic: "1.5.1"
    kind: paper
    title: GUI vs CLI — two each
    task: |
      Two advantages of a GUI for a new user, two advantages of a CLI for a technician.
    hint: Learning curve vs speed, scripting, resources.
    answer: |
      GUI: easier to learn; discoverable (you can see icons); fewer typing errors.

      CLI: faster for experts; easy to automate with scripts; uses fewer resources; works when graphics are broken.
  - id: e3
    topic: "1.5.2"
    kind: paper
    title: Which utility?
    task: |
      1. A stolen USB stick should be unreadable.
      2. An old HDD has become slow; files are in pieces.
      3. Emailing a 40 MB folder of text logs through a 10 MB limit.
      For each: the utility, and one sentence of purpose.
    hint: Encryption, defragmentation, compression.
    answer: |
      1. Encryption software — ciphertext without the key
      2. Defragmentation — contiguous blocks, less head travel (HDD only)
      3. Compression — smaller file to send
  - id: e4
    topic: "1.5.2"
    kind: think
    title: Why not defrag the SSD?
    task: |
      In two sentences, why defragmentation is for HDDs and a bad idea as “maintenance” on an SSD.
    hint: Moving parts vs random-access flash; write wear.
    answer: |
      HDDs have a moving head, so scattered blocks cost time; SSDs can access any cell equally quickly, so “putting the file together” does not speed it up.

      Extra writes from defrag wear flash and shorten SSD life.
quiz:
  - id: q1
    topic: "1.5.1"
    type: single
    prompt: Device drivers are used so that…
    options:
      - The CPU can run at a higher clock speed
      - The OS can communicate with a particular piece of hardware
      - Web pages load over HTTPS
      - Binary becomes hex
    correct: The OS can communicate with a particular piece of hardware
    explain: A driver translates OS requests into what that printer/GPU/NIC understands.
  - id: q2
    topic: "1.5.1"
    type: multi
    prompt: Which of these are functions of an operating system? (Select all that apply)
    options:
      - Memory management
      - Compiling Python to machine code for sale
      - File management
      - User management
    correct:
      - Memory management
      - File management
      - User management
    explain: Compilers are development tools, not a required OS function in this spec list.
  - id: q3
    topic: "1.5.1"
    type: single
    prompt: Multitasking on a single core works by…
    options:
      - Running every instruction of every program in the same clock tick
      - Switching the CPU rapidly between processes so they appear simultaneous
      - Using only ROM
      - Compressing the OS
    correct: Switching the CPU rapidly between processes so they appear simultaneous
    explain: Scheduling time-slices. True parallelism needs multiple cores (1.1.2).
  - id: q4
    topic: "1.5.2"
    type: single
    prompt: Defragmentation is used on a magnetic HDD to…
    options:
      - Encrypt the disk
      - Reassemble scattered file blocks so they are stored together
      - Increase clock speed
      - Translate domain names
    correct: Reassemble scattered file blocks so they are stored together
    explain: The head then travels less. Not an SSD job.
  - id: q5
    topic: "1.5.2"
    type: single
    prompt: Encryption utility software is used to…
    options:
      - Make files smaller by throwing pixels away
      - Scramble data so it is unreadable without a key
      - Assign MAC addresses
      - Draw a star topology
    correct: Scramble data so it is unreadable without a key
    explain: Compression shrinks. Encryption hides. They are different utilities.
  - id: q6
    topic: "1.5.1"
    type: truefalse
    prompt: An operating system is application software like a browser or a game.
    options:
      - True
      - False
    correct: "False"
    explain: The OS is systems software. Applications run on top of it.
