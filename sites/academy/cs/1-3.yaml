title: "1.3 Networks, connections and protocols"
hero_title: "Networks, connections and protocols"
kicker: "Paper 1 · J277/01 · unit 1.3"
description: >-
  LAN/WAN, switches and routers, star and mesh, DNS and the cloud, IP vs MAC,
  protocols and layers. Exercises and quiz, no locks.
template: academy_cs_unit.html
doc_id: "1-3"
unit_id: "1.3"
strip_leading_h1: true
exercises:
  - id: e1
    topic: "1.3.1"
    kind: paper
    title: LAN or WAN?
    task: |
      1. All PCs on one school site, sharing a printer.
      2. The school’s three campuses in different towns, linked together.
      3. A phone using 4G to reach tyneside.academy.
      For each: LAN or WAN, and one justification.
    hint: One site / one organisation vs wide area / many networks.
    answer: |
      1. LAN — single site, school-owned
      2. WAN — multiple sites over a large area
      3. WAN (the internet) — public wide-area networks
  - id: e2
    topic: "1.3.1"
    kind: paper
    title: Switch vs router
    task: |
      Write two differences between a switch and a router that would score
      on OCR (role + address type is a strong pair).
    hint: Same network vs different networks. MAC vs IP.
    answer: |
      A switch connects devices on the same LAN and forwards using MAC addresses.

      A router connects different networks (e.g. LAN to internet) and forwards using IP addresses.
  - id: e3
    topic: "1.3.1"
    kind: paper
    title: Star topology — two plus, two minus
    task: |
      A new classroom LAN will be a star. Give two advantages and two
      disadvantages compared with a mesh.
    hint: Cost and simplicity vs what happens when the centre dies.
    answer: |
      + Cheaper/simpler cabling than a full mesh
      + A single end-device cable fault usually isolates only that device
      − Central switch is a single point of failure
      − Less redundant than mesh (no alternative path if the hub/switch fails)
  - id: e4
    topic: "1.3.2"
    kind: paper
    title: Protocol match
    task: |
      Which protocol?

      1. Load a web page with encryption
      2. Send an email from your mail server to the recipient’s server
      3. Read the same inbox on phone and laptop, leaving mail on the server
      4. Split a file into packets and make sure they all arrive in order
      5. Turn tyneside.academy into an IP address
    hint: HTTPS vs HTTP. SMTP sends. IMAP syncs. TCP is reliable transport. DNS names.
    answer: |
      1. HTTPS
      2. SMTP
      3. IMAP
      4. TCP
      5. DNS
  - id: e5
    topic: "1.3.2"
    kind: think
    title: IP or MAC?
    task: |
      1. A switch deciding which port to send a frame to.
      2. A router deciding the next network hop to reach 8.8.8.8.
      3. Identifying a specific USB Wi-Fi dongle on the LAN.
    hint: Local hardware identity vs worldwide routing identity.
    answer: |
      1. MAC
      2. IP
      3. MAC
quiz:
  - id: q1
    topic: "1.3.1"
    type: single
    prompt: Which device connects a home LAN to the internet?
    options:
      - Switch
      - Router
      - NIC only
      - DNS
    correct: Router
    explain: Routers join different networks. The switch stays inside the LAN. DNS is a naming service, not a box that routes by itself.
  - id: q2
    topic: "1.3.1"
    type: single
    prompt: DNS is used to…
    options:
      - Encrypt Wi-Fi
      - Translate domain names into IP addresses
      - Compress images
      - Assign MAC addresses at the factory
    correct: Translate domain names into IP addresses
    explain: Humans use names; packets need IPs. DNS is the lookup.
  - id: q3
    topic: "1.3.1"
    type: single
    prompt: A disadvantage of star topology is that…
    options:
      - Every device needs a unique protocol
      - Failure of the central switch can take down the LAN
      - It cannot use Ethernet
      - It requires the internet
    correct: Failure of the central switch can take down the LAN
    explain: The centre is a single point of failure. Device cables failing is usually local only.
  - id: q4
    topic: "1.3.2"
    type: single
    prompt: Which protocol is used to send email between mail servers?
    options:
      - FTP
      - SMTP
      - IMAP
      - HTTP
    correct: SMTP
    explain: SMTP sends. IMAP/POP receive. HTTP is the web. FTP is files.
  - id: q5
    topic: "1.3.2"
    type: single
    prompt: HTTPS is preferred over HTTP because…
    options:
      - It is always faster
      - Data is encrypted in transit
      - It does not use IP
      - It avoids DNS
    correct: Data is encrypted in transit
    explain: The S is TLS encryption. HTTP is plaintext on the wire.
  - id: q6
    topic: "1.3.2"
    type: multi
    prompt: Which statements about layers are true? (Select all that apply)
    options:
      - Layers let one part of the stack change without rewriting all of it
      - HTTP sits at the application layer
      - IP sits at the application layer
      - Ethernet/Wi-Fi sit at the network-access layer
    correct:
      - Layers let one part of the stack change without rewriting all of it
      - HTTP sits at the application layer
      - Ethernet/Wi-Fi sit at the network-access layer
    explain: IP is the internet layer. HTTP is application. Physical/link technologies are network access.
  - id: q7
    topic: "1.3.2"
    type: single
    prompt: A MAC address identifies…
    options:
      - A website’s owner
      - A network interface (hardware) on a LAN
      - Only printers
      - The clock speed of the CPU
    correct: A network interface (hardware) on a LAN
    explain: MAC is the NIC’s hardware identifier, written in hex. IP is the logical network address.
