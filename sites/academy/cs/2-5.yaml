title: "2.5 Programming languages and IDEs"
hero_title: "Languages and IDEs"
kicker: "Paper 2 · J277/02 · unit 2.5"
description: >-
  High-level vs low-level, compiler vs interpreter, IDE facilities. Short
  lesson, open quiz, no gates.
template: academy_cs_unit.html
doc_id: "2-5"
unit_id: "2.5"
strip_leading_h1: true
exercises:
  - id: e1
    topic: "2.5.1"
    kind: paper
    title: High or low?
    task: |
      1. Python
      2. Machine code
      3. Assembly
      4. OCR Exam Reference Language
      For each: high or low, and one reason.
    hint: Close to English vs close to the CPU.
    answer: |
      1. High — readable, portable, needs a translator
      2. Low — binary for a CPU
      3. Low — mnemonics for CPU instructions
      4. High — designed for humans / exams, not a chip
  - id: e2
    topic: "2.5.1"
    kind: paper
    title: Compiler vs interpreter — four bullets
    task: |
      Two differences that favour a compiler for a shipped game,
      two that favour an interpreter while you are learning.
    hint: Speed of finished program vs speed of trying a change; distributing an exe vs needing the interpreter.
    answer: |
      Compiler / game: whole program already machine code so it runs faster; players do not need the compiler or source.

      Interpreter / learning: run immediately without a compile step; stops at the line with the error so you see it in context.
  - id: e3
    topic: "2.5.2"
    kind: think
    title: Hunt the IDE
    task: |
      Open whatever you write Python in. Find and name:

      1. The editor pane
      2. Where error messages appear
      3. The run button / command
      4. (Bonus) a debugger step-over or breakpoint
    hint: If you only have notepad, that is an editor without the rest — say so.
    answer: |
      Example (Thonny): editor is the top pane; errors in the shell/red underline; Run (F5); debugger is the bug icon / step buttons.

      Example (VS Code): editor tab; Problems panel; play/run Python file; breakpoints in the gutter.
quiz:
  - id: q1
    topic: "2.5.1"
    type: single
    prompt: Machine code is…
    options:
      - A high-level language like Python
      - Binary instructions the CPU can execute
      - A type of topology
      - Lossy compression
    correct: Binary instructions the CPU can execute
    explain: Lowest level. Assembly is text for those instructions. Python is high-level.
  - id: q2
    topic: "2.5.1"
    type: single
    prompt: An interpreter…
    options:
      - Always produces a .exe you can run without it
      - Translates and runs the program statement by statement
      - Is a kind of SSD
      - Assigns MAC addresses
    correct: Translates and runs the program statement by statement
    explain: Compilers translate the whole program first. Interpreters work as they go.
  - id: q3
    topic: "2.5.1"
    type: multi
    prompt: Advantages of high-level languages include… (Select all that apply)
    options:
      - Easier for humans to read and write
      - More portable across machines (with a translator)
      - They remove the need for any CPU
      - Closer to natural language than binary
    correct:
      - Easier for humans to read and write
      - More portable across machines (with a translator)
      - Closer to natural language than binary
    explain: You still need a CPU. High-level source is translated into what the CPU understands.
  - id: q4
    topic: "2.5.2"
    type: single
    prompt: Syntax highlighting is a feature of the IDE’s…
    options:
      - Router
      - Editor
      - HDD defragmenter
      - DNS
    correct: Editor
    explain: Colouring keywords as you type lives in the editor.
  - id: q5
    topic: "2.5.2"
    type: single
    prompt: A run-time environment in an IDE is there to…
    options:
      - Encrypt the BIOS
      - Execute the program and handle input/output while you develop
      - Draw a mesh topology
      - Replace the ALU
    correct: Execute the program and handle input/output while you develop
    explain: It is how you actually run what you wrote, inside the IDE.
  - id: q6
    topic: "2.5.1"
    type: truefalse
    prompt: Once a program is compiled, you typically still need the compiler on the user’s PC to run it.
    options:
      - True
      - False
    correct: "False"
    explain: The executable is machine code. The compiler was a build tool. (Interpreted programs still need the interpreter.)
