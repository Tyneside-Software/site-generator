title: "2.3 Producing robust programs"
hero_title: "Producing robust programs"
kicker: "Paper 2 · J277/02 · unit 2.3"
description: >-
  Defensive design, authentication, validation, maintainable code, testing types
  and test data. Open exercises and quiz.
template: academy_cs_unit.html
doc_id: "2-3"
unit_id: "2.3"
strip_leading_h1: true
exercises:
  - id: e1
    topic: "2.3.1"
    kind: python
    title: Validate a score
    task: |
      Score must be an integer 0 to 100 inclusive. Keep asking until it is valid,
      then print it. Handle non-numeric input without crashing.
    hint: try/except ValueError, or check .isdigit() with care for signs. Range check after int().
    answer: |
      while True:
          raw = input("Score 0-100: ")
          try:
              score = int(raw)
          except ValueError:
              print("Must be a whole number")
              continue
          if score < 0 or score > 100:
              print("Out of range")
              continue
          break
      print("Recorded", score)
  - id: e2
    topic: "2.3.1"
    kind: paper
    title: Name the check
    task: |
      Presence, range, type, format, or length?

      1. Password at least 8 characters
      2. Email contains @
      3. Quantity is a number, not "three"
      4. Quantity is between 1 and 10
      5. Surname is not blank
    hint: Five rows, five names.
    answer: |
      1. Length
      2. Format
      3. Type
      4. Range
      5. Presence
  - id: e3
    topic: "2.3.1"
    kind: paper
    title: Make it maintainable
    task: |
      Rewrite this so a marker would smile. Keep the same behaviour.

      x=input("n")
      y=0
      for i in range(int(x)):
        y=y+i
      print(y)
    hint: >-
      Names, spaces, a comment for the purpose, maybe a function.
      Note that this sums 0 through n-1.
    answer: |
      # Sum of 0 + 1 + ... + (n-1)
      n_text = input("How many terms? ")
      n = int(n_text)
      total = 0
      for number in range(n):
          total = total + number
      print(total)
  - id: e4
    topic: "2.3.2"
    kind: paper
    title: Test plan for age 11–16
    task: |
      A form only accepts ages 11 to 16 inclusive. Write six tests as
      (data, kind, expected). Include normal, both boundaries, and invalids
      (too small, too big, not a number).
    hint: 11 and 16 are boundaries. 10 and 17 are invalid. 14 is normal.
    answer: |
      14, normal, accept
      11, boundary, accept
      16, boundary, accept
      10, invalid, reject
      17, invalid, reject
      "twelve", invalid, reject
quiz:
  - id: q1
    topic: "2.3.1"
    type: single
    prompt: Checking that an input is not blank is…
    options:
      - Range check
      - Presence check
      - A syntax error
      - Merge sort
    correct: Presence check
    explain: Presence = is there something there? Range is min/max of a value.
  - id: q2
    topic: "2.3.1"
    type: single
    prompt: Validation differs from verification because validation…
    options:
      - Proves the data is the true real-world value
      - Checks the data is reasonable / in the right form
      - Is only used in SQL
      - Replaces testing
    correct: Checks the data is reasonable / in the right form
    explain: Validation is “looks legal”. Verification is “is it the right thing” (double-entry, checksum).
  - id: q3
    topic: "2.3.1"
    type: multi
    prompt: Which help maintainability? (Select all that apply)
    options:
      - Meaningful identifiers
      - Consistent indentation
      - Comments that explain purpose
      - One-letter names for everything, no comments
    correct:
      - Meaningful identifiers
      - Consistent indentation
      - Comments that explain purpose
    explain: The last option is how logic errors hide.
  - id: q4
    topic: "2.3.2"
    type: single
    prompt: Test data on the allowed minimum and maximum is called…
    options:
      - Invalid
      - Boundary
      - Syntax
      - Cloud
    correct: Boundary
    explain: Boundary/extreme valid. Invalid sits outside. Normal sits comfortably inside.
  - id: q5
    topic: "2.3.2"
    type: single
    prompt: Iterative testing happens…
    options:
      - Only after the entire system is finished
      - During development, as each part is built
      - Only in the ALU
      - Instead of writing code
    correct: During development, as each part is built
    explain: Final/terminal testing is the whole system against requirements.
  - id: q6
    topic: "2.3.2"
    type: truefalse
    prompt: A program that crashes when you type a letter into an age box has passed robust design.
    options:
      - True
      - False
    correct: "False"
    explain: That is a runtime failure on invalid input. Defensive design would catch and reject it.
