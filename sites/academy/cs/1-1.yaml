title: "1.1 Systems architecture"
hero_title: "Systems architecture"
kicker: "Paper 1 · J277/01 · unit 1.1"
description: >-
  CPU purpose, Von Neumann, ALU/CU/cache/registers, fetch–execute, performance
  factors, and embedded systems. Exercises and a self-check quiz — nothing locked.
template: academy_cs_unit.html
