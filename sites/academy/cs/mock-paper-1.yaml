quiz:
  - id: p1q01
    unit: "1-1"
    unit_title: "1.1 Systems architecture"
    topic: "1.1.1"
    type: single
    prompt: What is the main purpose of the control unit?
    options:
      - To store the operating system permanently
      - To decode instructions and send control signals to other CPU parts
      - To display windows on the screen
      - To connect a LAN to the internet
    correct: To decode instructions and send control signals to other CPU parts
    explain: The CU coordinates the cycle. The ALU does the arithmetic; RAM holds running programs.
  - id: p1q02
    unit: "1-1"
    unit_title: "1.1 Systems architecture"
    topic: "1.1.1"
    type: single
    prompt: Which register holds the data or instruction just copied from memory?
    options:
      - Program Counter (PC)
      - Memory Address Register (MAR)
      - Memory Data Register (MDR)
      - Accumulator (ACC)
    correct: Memory Data Register (MDR)
    explain: MAR holds the address. MDR holds the bits that came from (or will go to) that address. PC holds the next instruction address.
  - id: p1q03
    unit: "1-1"
    unit_title: "1.1 Systems architecture"
    topic: "1.1.1"
    type: single
    prompt: In the Von Neumann model, instructions and data are typically stored…
    options:
      - In two completely separate memories that never share a bus
      - In the same memory, sharing a bus
      - Only on optical discs
      - Only in ROM
    correct: In the same memory, sharing a bus
    explain: That shared memory and bus is the Von Neumann bottleneck.
  - id: p1q04
    unit: "1-1"
    unit_title: "1.1 Systems architecture"
    topic: "1.1.2"
    type: single
    prompt: Increasing clock speed can improve performance because…
    options:
      - The CPU completes more fetch–execute cycles in the same time
      - RAM becomes non-volatile
      - The computer no longer needs secondary storage
      - MAC addresses get longer
    correct: The CPU completes more fetch–execute cycles in the same time
    explain: More ticks per second, more work — until heat, power, or waiting on RAM gets in the way.
  - id: p1q05
    unit: "1-1"
    unit_title: "1.1 Systems architecture"
    topic: "1.1.3"
    type: single
    prompt: Which is the best example of an embedded system?
    options:
      - A school laptop used for many subjects
      - The controller inside a dishwasher
      - A desktop used for video editing and games
      - A smartphone running arbitrary apps
    correct: The controller inside a dishwasher
    explain: Dedicated function inside another device. Phones and laptops are general-purpose.
  - id: p1q06
    unit: "1-2"
    unit_title: "1.2 Memory and storage"
    topic: "1.2.1"
    type: single
    prompt: RAM is described as volatile because…
    options:
      - It can only be written at the factory
      - Its contents are lost when power is removed
      - It is slower than magnetic tape
      - It stores the BIOS forever
    correct: Its contents are lost when power is removed
    explain: Volatile needs power. ROM and secondary storage keep data with the power off.
  - id: p1q07
    unit: "1-2"
    unit_title: "1.2 Memory and storage"
    topic: "1.2.1"
    type: single
    prompt: Virtual memory is used when…
    options:
      - The CPU has no ALU
      - RAM is full and inactive pages are moved to secondary storage
      - You compress a JPEG
      - A switch forwards a frame
    correct: RAM is full and inactive pages are moved to secondary storage
    explain: It extends RAM onto disk. Too much of it is thrashing.
  - id: p1q08
    unit: "1-2"
    unit_title: "1.2 Memory and storage"
    topic: "1.2.2"
    type: single
    prompt: Why choose an SSD rather than a spinning HDD for a laptop that is carried every day?
    options:
      - SSDs always have more capacity for less money
      - No moving parts, so more shock-resistant and usually faster
      - SSDs are optical
      - HDDs cannot store an operating system
    correct: No moving parts, so more shock-resistant and usually faster
    explain: Flash vs platters. HDDs still win on cheap bulk capacity.
  - id: p1q09
    unit: "1-2"
    unit_title: "1.2 Memory and storage"
    topic: "1.2.3"
    type: single
    prompt: How many bits are in a nibble?
    options:
      - "2"
      - "4"
      - "8"
      - "16"
    correct: "4"
    explain: Nibble is 4 bits. Byte is 8 bits.
  - id: p1q10
    unit: "1-2"
    unit_title: "1.2 Memory and storage"
    topic: "1.2.4"
    type: single
    prompt: What is the denary value of the binary number 00011110?
    options:
      - "16"
      - "24"
      - "30"
      - "60"
    correct: "30"
    explain: 16+8+4+2 = 30.
  - id: p1q11
    unit: "1-2"
    unit_title: "1.2 Memory and storage"
    topic: "1.2.4"
    type: single
    prompt: Convert the binary nibble-pair 1010 1111 to hexadecimal.
    options:
      - A9
      - AF
      - F1
      - 9A
    correct: AF
    explain: 1010 is A (10), 1111 is F (15).
  - id: p1q12
    unit: "1-2"
    unit_title: "1.2 Memory and storage"
    topic: "1.2.4"
    type: single
    prompt: A logical left shift of one place on a binary integer (no bits lost) is equivalent to…
    options:
      - Dividing by 2
      - Multiplying by 2
      - Adding 1
      - Converting to ASCII
    correct: Multiplying by 2
    explain: Left shift ×2. Right shift ÷2 (integer).
  - id: p1q13
    unit: "1-2"
    unit_title: "1.2 Memory and storage"
    topic: "1.2.4"
    type: single
    prompt: Overflow occurs when…
    options:
      - A file is compressed
      - The result of a calculation will not fit in the bits available
      - Cache is larger than RAM
      - A protocol uses HTTPS
    correct: The result of a calculation will not fit in the bits available
    explain: In 8-bit unsigned, 255+1 has nowhere to put the extra 1.
  - id: p1q14
    unit: "1-2"
    unit_title: "1.2 Memory and storage"
    topic: "1.2.4"
    type: single
    prompt: Uncompressed bitmap size in bits is…
    options:
      - Width + height + colour depth
      - Width × height × colour depth
      - Colour depth only
      - Width × height ÷ 8
    correct: Width × height × colour depth
    explain: Every pixel uses colour-depth bits. Then convert to bytes if asked.
  - id: p1q15
    unit: "1-2"
    unit_title: "1.2 Memory and storage"
    topic: "1.2.5"
    type: single
    prompt: Which statement about lossy compression is true?
    options:
      - The original bits can always be reconstructed exactly
      - Some data is discarded and cannot be recovered
      - It is only used for source code
      - It always makes files larger
    correct: Some data is discarded and cannot be recovered
    explain: JPEG and MP3 are typical lossy. PNG and ZIP are lossless.
  - id: p1q16
    unit: "1-3"
    unit_title: "1.3 Networks, connections and protocols"
    topic: "1.3.1"
    type: single
    prompt: Which device connects a home LAN to the internet?
    options:
      - Switch
      - Router
      - NIC only
      - Defragmenter
    correct: Router
    explain: Routers join different networks. Switches stay inside the LAN.
  - id: p1q17
    unit: "1-3"
    unit_title: "1.3 Networks, connections and protocols"
    topic: "1.3.1"
    type: single
    prompt: DNS is used to…
    options:
      - Encrypt a hard disk
      - Translate a domain name into an IP address
      - Compress sound
      - Assign clock speed
    correct: Translate a domain name into an IP address
    explain: Humans use names. Packets need IPs.
  - id: p1q18
    unit: "1-3"
    unit_title: "1.3 Networks, connections and protocols"
    topic: "1.3.1"
    type: single
    prompt: A disadvantage of star topology is that…
    options:
      - Ethernet cannot be used
      - Failure of the central switch can take down the LAN
      - Every device needs its own WAN
      - MAC addresses stop working
    correct: Failure of the central switch can take down the LAN
    explain: The centre is a single point of failure. A single end-device cable usually only isolates that device.
  - id: p1q19
    unit: "1-3"
    unit_title: "1.3 Networks, connections and protocols"
    topic: "1.3.2"
    type: single
    prompt: A MAC address identifies…
    options:
      - A website owner
      - A network interface (hardware) on a LAN
      - Only email servers
      - The sample rate of a sound file
    correct: A network interface (hardware) on a LAN
    explain: MAC is the NIC. IP is the logical address used for routing between networks.
  - id: p1q20
    unit: "1-3"
    unit_title: "1.3 Networks, connections and protocols"
    topic: "1.3.2"
    type: single
    prompt: HTTPS is preferred over HTTP because…
    options:
      - It never uses DNS
      - Data is encrypted in transit
      - It is always slower, which is safer
      - It replaces the need for an IP address
    correct: Data is encrypted in transit
    explain: The S is TLS. HTTP is plaintext on the wire.
  - id: p1q21
    unit: "1-3"
    unit_title: "1.3 Networks, connections and protocols"
    topic: "1.3.2"
    type: single
    prompt: Which protocol is used to send email from one mail server to another?
    options:
      - IMAP
      - SMTP
      - FTP
      - HTTP
    correct: SMTP
    explain: SMTP sends. IMAP/POP receive. FTP is files. HTTP is the web.
  - id: p1q22
    unit: "1-4"
    unit_title: "1.4 Network security"
    topic: "1.4.1"
    type: single
    prompt: Ransomware typically…
    options:
      - Speeds up virtual memory
      - Encrypts files and demands payment for the key
      - Translates domain names
      - Draws a star topology
    correct: Encrypts files and demands payment for the key
    explain: Malware whose payload is extortion via encryption.
  - id: p1q23
    unit: "1-4"
    unit_title: "1.4 Network security"
    topic: "1.4.1"
    type: single
    prompt: A brute-force attack on a login page is…
    options:
      - Trying many passwords or keys until one works
      - Flooding a server until it falls over
      - Tricking a person with a fake invoice
      - Injecting SQL into a search box
    correct: Trying many passwords or keys until one works
    explain: Lockouts and 2FA are the usual defences. Flooding is DoS. Fake invoice is phishing.
  - id: p1q24
    unit: "1-4"
    unit_title: "1.4 Network security"
    topic: "1.4.2"
    type: single
    prompt: A firewall is used to…
    options:
      - Allow or block network traffic according to rules
      - Defragment a magnetic disk
      - Convert binary to hex
      - Store the BIOS
    correct: Allow or block network traffic according to rules
    explain: It filters traffic. It does not replace anti-malware or encryption.
  - id: p1q25
    unit: "1-4"
    unit_title: "1.4 Network security"
    topic: "1.4.1"
    type: single
    prompt: SQL injection attacks a system by…
    options:
      - Overheating the CPU
      - Inserting malicious SQL into an input so the database runs it
      - Guessing Wi-Fi PINs only
      - Compressing packets
    correct: Inserting malicious SQL into an input so the database runs it
    explain: User input treated as code. Parameterised queries stop it.
  - id: p1q26
    unit: "1-5"
    unit_title: "1.5 Systems software"
    topic: "1.5.1"
    type: single
    prompt: Device drivers exist so that…
    options:
      - The OS can communicate with a particular piece of hardware
      - Clock speed can exceed 10 GHz safely
      - HTTPS can replace HTTP
      - Files become lossy
    correct: The OS can communicate with a particular piece of hardware
    explain: A driver translates OS requests for that printer, NIC, or GPU.
  - id: p1q27
    unit: "1-5"
    unit_title: "1.5 Systems software"
    topic: "1.5.2"
    type: single
    prompt: Defragmentation is intended for…
    options:
      - Solid-state drives, to wear the flash evenly
      - Magnetic HDDs, to put scattered file blocks back together
      - ROM chips in a microwave
      - DNS servers
    correct: Magnetic HDDs, to put scattered file blocks back together
    explain: Moving heads care about fragmentation. SSDs do not need defrag and extra writes wear them.
  - id: p1q28
    unit: "1-6"
    unit_title: "1.6 Impacts of digital technology"
    topic: "1.6.1"
    type: single
    prompt: Using a stolen password to open a school database is covered mainly by the…
    options:
      - Data Protection Act 2018
      - Computer Misuse Act 1990
      - Copyright, Designs and Patents Act 1988
      - Highway Code
    correct: Computer Misuse Act 1990
    explain: Unauthorised access is CMA. DPA is personal data. CDPA is copying creative work.
  - id: p1q29
    unit: "1-6"
    unit_title: "1.6 Impacts of digital technology"
    topic: "1.6.1"
    type: single
    prompt: Selling a customer email list without a lawful basis most clearly breaks…
    options:
      - Computer Misuse Act
      - Data protection law (DPA 2018 / UK GDPR)
      - Only a school rule, never the law
      - Binary addition
    correct: Data protection law (DPA 2018 / UK GDPR)
    explain: Personal data must be used fairly, for stated purposes, with a lawful basis.
  - id: p1q30
    unit: "1-6"
    unit_title: "1.6 Impacts of digital technology"
    topic: "1.6.1"
    type: single
    prompt: Open-source software means…
    options:
      - There is no copyright at all
      - The source code is available and a licence grants use or modification under stated terms
      - It cannot be used in schools
      - It always costs more than proprietary software
    correct: The source code is available and a licence grants use or modification under stated terms
    explain: Still copyrighted. The licence is how freedoms (and duties) are granted.
