# Lewis’s GCSE Computer Science course map.
# Spec: Cambridge OCR J277 (9–1). First assessment 2022. Version 3.1 (May 2026).
# Official PDF: https://www.ocr.org.uk/qualifications/gcse/computer-science-j277-from-2020/
# If Lewis sits a different board, topics mostly overlap — retag the codes.

board: Cambridge OCR
spec: J277
qualification: GCSE (9–1) Computer Science
first_assessment: 2022
status: First subject. Full open lessons — teach, exercises, quiz. No gates.

stats:
  papers: 2
  units: 11
  topics: 26

papers:
  - id: paper-1
    code: J277/01
    title: Computer systems
    weight: 50%
    duration: 1 hour 30 minutes
    marks: 80
    calculator: false
    blurb: How computers actually work — the box, the data, the network, the rules.
    units:
      - id: "1.1"
        title: Systems architecture
        blurb: What the processor is, how it runs a program, and computers that live inside other things.
        topics:
          - id: "1.1.1"
            title: Architecture of the CPU
            sketch: Purpose of the CPU. Von Neumann. ALU, CU, cache, registers (PC, ACC, MAR, MDR, CIR). Fetch–execute cycle, one step at a time.
          - id: "1.1.2"
            title: CPU performance
            sketch: Clock speed, cache size, number of cores — what each one changes, and the usual trade-offs.
          - id: "1.1.3"
            title: Embedded systems
            sketch: A computer built into another device. Examples, typical characteristics, why you would (and would not) use one.

      - id: "1.2"
        title: Memory and storage
        blurb: Where data lives while a program runs, where it lives when the power is off, and how we measure and encode it.
        topics:
          - id: "1.2.1"
            title: Primary storage
            sketch: RAM vs ROM. Virtual memory. Why a computer needs each, and what happens when RAM runs out.
          - id: "1.2.2"
            title: Secondary storage
            sketch: Magnetic, solid state, optical. Capacity, speed, cost, portability, durability. How to choose for a given job.
          - id: "1.2.3"
            title: Units
            sketch: Bit, nibble, byte, through to petabyte. Why 1,024 not 1,000. File-size and capacity calculations — show working.
          - id: "1.2.4"
            title: Data storage
            sketch: Numbers (binary, denary, hex, addition, overflow, shifts). Characters (ASCII, Unicode). Images (pixels, colour depth, metadata). Sound (sample rate, bit depth).
          - id: "1.2.5"
            title: Compression
            sketch: Why we compress. Lossy vs lossless. When each is the right call, and what you give up.

      - id: "1.3"
        title: Computer networks, connections and protocols
        blurb: How machines talk — local, worldwide, wired, wireless, and the rules they agree on.
        topics:
          - id: "1.3.1"
            title: Networks and topologies
            sketch: LAN vs WAN. Hardware (NIC, switch, router, WAP). Star and mesh. Internet, DNS, hosting, the cloud, web servers vs clients.
          - id: "1.3.2"
            title: Wired and wireless, protocols and layers
            sketch: Ethernet, Wi-Fi, Bluetooth. IP vs MAC. Standards. Common protocols (TCP/IP, HTTP, HTTPS, FTP, POP, IMAP, SMTP). Layers — what a layer is for.

      - id: "1.4"
        title: Network security
        blurb: How systems get attacked, and what you actually do about it.
        topics:
          - id: "1.4.1"
            title: Threats to computer systems and networks
            sketch: Malware, social engineering, phishing, brute force, DoS, data interception, SQL injection. What each one is trying to do.
          - id: "1.4.2"
            title: Identifying and preventing vulnerabilities
            sketch: Penetration testing. Anti-malware, firewalls, user access levels, passwords, encryption, physical security. Match the defence to the threat.

      - id: "1.5"
        title: Systems software
        blurb: The software that runs the machine, and the little tools that keep it usable.
        topics:
          - id: "1.5.1"
            title: Operating systems
            sketch: User interface, memory management, multitasking, peripheral management, user management, file management. What the OS is doing while you are not looking.
          - id: "1.5.2"
            title: Utility software
            sketch: Encryption software, defragmentation, compression. Extra jobs the OS may not do on its own.

      - id: "1.6"
        title: Ethical, legal, cultural and environmental impacts
        blurb: Technology is not just circuits. People, law, culture, and the planet get a vote.
        topics:
          - id: "1.6.1"
            title: Impacts of digital technology
            sketch: Stakeholders, privacy, access, work, culture, environment. Legislation you must be able to name and apply — Data Protection (UK GDPR), Computer Misuse, Copyright. Open source vs proprietary licences. Extended-response practice lives here.

  - id: paper-2
    code: J277/02
    title: Computational thinking, algorithms and programming
    weight: 50%
    duration: 1 hour 30 minutes
    marks: 80
    calculator: false
    blurb: Thinking, designing, tracing, and writing programs — including a long programming scenario.
    units:
      - id: "2.1"
        title: Algorithms
        blurb: How you think a problem into steps, write those steps down, and know the famous ones.
        topics:
          - id: "2.1.1"
            title: Computational thinking
            sketch: Abstraction, decomposition, algorithmic thinking. Spot which one a question is asking for.
          - id: "2.1.2"
            title: Designing, creating and refining algorithms
            sketch: Inputs, processes, outputs. Structure diagrams. Pseudocode and flowcharts. Trace tables. Nesting. Find and fix errors. OCR Exam Reference Language.
          - id: "2.1.3"
            title: Searching and sorting algorithms
            sketch: Linear search, binary search. Bubble sort, insertion sort, merge sort. Be able to step through them, not just name them.

      - id: "2.2"
        title: Programming fundamentals
        blurb: The language of Paper 2 — constructs, types, and the extra techniques the exam actually uses.
        topics:
          - id: "2.2.1"
            title: Programming fundamentals
            sketch: Variables, constants, operators, inputs, outputs, assignment. Sequence, selection, iteration. Count-controlled and condition-controlled loops. Nesting the three constructs.
          - id: "2.2.2"
            title: Data types
            sketch: Integer, real, Boolean, character, string. Casting. Why the type matters when the exam tries to trip you.
          - id: "2.2.3"
            title: Additional programming techniques
            sketch: String handling. Arrays (1D and 2D) and records. Files. Functions and procedures, parameters, return values, scope. SQL. Random numbers.

      - id: "2.3"
        title: Producing robust programs
        blurb: Code that survives bad input, and tests that actually find the bugs.
        topics:
          - id: "2.3.1"
            title: Defensive design
            sketch: Anticipate misuse. Authentication. Input validation. Maintainable code — naming, indentation, comments.
          - id: "2.3.2"
            title: Testing
            sketch: Iterative vs final/terminal testing. Syntax errors vs logic errors. Test data — normal, boundary, invalid. A test plan that would convince a marker.

      - id: "2.4"
        title: Boolean logic
        blurb: AND, OR, NOT — on paper, in a truth table, and as a diagram.
        topics:
          - id: "2.4.1"
            title: Boolean logic
            sketch: Operators, truth tables, combining gates, drawing and reading logic diagrams. Same ideas as in a program, different picture.

      - id: "2.5"
        title: Programming languages and IDEs
        blurb: Why we do not write everything in binary, and what the editor is doing for you.
        topics:
          - id: "2.5.1"
            title: Languages
            sketch: High-level vs low-level. Translators. Compiler vs interpreter — characteristics and when each is used.
          - id: "2.5.2"
            title: The IDE
            sketch: Editors, error diagnostics, run-time environment, translators. What an IDE gives you that a plain text file does not.

programming:
  id: programming
  title: Practical programming
  blurb: Not a third exam paper — but the spec requires real coding hours, and Paper 2 will punish anyone who has only read about it.
  note: OCR expects programming experience (Python is the usual language). Lewis already ships games; this strand is exam-shaped Python and Exam Reference Language, not another arcade.
  topics:
    - id: py-core
      title: Python — the three constructs
      sketch: Sequence, selection, iteration until they are boring. Nested ifs and loops. Input, output, types.
    - id: py-extra
      title: Python — strings, lists, files, functions
      sketch: The 2.2.3 toolkit in a real language. 1D/2D lists, writing and reading files, functions that return values.
    - id: erl
      title: OCR Exam Reference Language
      sketch: Paper 2 is not “write Python”. Learn the exam’s own pseudocode so a question never looks foreign.
    - id: trace
      title: Trace tables and dry-runs
      sketch: Follow someone else’s logic on paper. This is where marks hide on Paper 2.
    - id: section-b
      title: Paper 2 Section B scenarios
      sketch: Longer programming questions. Design, write, correct, and complete algorithms under time.

exams:
  id: exams
  title: Exam craft
  blurb: Two written papers, no calculator, no coursework. Command words and past papers sit here when we get to them.
  topics:
    - id: papers
      title: The two papers
      sketch: J277/01 and J277/02. 80 marks, 1 hour 30 minutes, 50% each. Multiple choice, short, extended. Section B on Paper 2 is the programming scenario.
    - id: command
      title: Command words
      sketch: State, describe, explain, discuss — different length, different marks. Especially 1.6 extended responses.
    - id: past
      title: Past papers
      sketch: Empty until we start sitting them. Official papers and mark schemes from Cambridge OCR.

mocks:
  id: mock
  title: Mock exams
  blurb: Multiple-choice papers that mark themselves. Sit one, submit, get a score. Optional — nothing is locked behind a mark.
  papers:
    - id: mock-paper-1
      slug: mock-paper-1
      title: Paper 1 mock
      blurb: J277/01 Computer systems · 30 questions · optional 35-minute timer
      questions: 30
      minutes: 35
    - id: mock-paper-2
      slug: mock-paper-2
      title: Paper 2 mock
      blurb: J277/02 Algorithms and programming · 30 questions · optional 35-minute timer
      questions: 30
      minutes: 35
